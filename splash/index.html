<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starting</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1419; color: #e8edf2; cursor: none;
    font: 20px/1.4 system-ui, "DejaVu Sans", sans-serif; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; }
  img { max-width: 40vw; max-height: 30vh; }
  h1 { margin: 0; font-size: 32px; font-weight: 600; }
  p { margin: 0; color: #8b99a8; min-height: 1.4em; }
  .spin { width: 40px; height: 40px; border-radius: 50%; border: 4px solid #2a3541; border-top-color: #4aa3ff; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
<script src="config.js"></script>
</head>
<body>
<main>
  <img src="logo.svg" alt="" onerror="this.remove()">
  <h1 id="title">Starting</h1>
  <div class="spin" aria-hidden="true"></div>
  <p id="status"></p>
</main>
<script>
(function () {
  var cfg = window.HMI || {};
  if (cfg.title) document.getElementById("title").textContent = cfg.title;
  var status = document.getElementById("status");
  var started = Date.now();
  function tick() {
    // no-cors: any answer of the server counts as "reachable", the content is not needed
    fetch(cfg.target, { mode: "no-cors", cache: "no-store" }).then(function () {
      location.replace(cfg.target);
    }, function () {
      var s = Math.round((Date.now() - started) / 1000);
      status.textContent = s > 20 ? "Waiting for the service (" + s + " s)" : "";
      setTimeout(tick, 2000);
    });
  }
  if (cfg.target) tick(); else status.textContent = "No start page configured";
})();
</script>
</body>
</html>
